specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: ProofVerifier
    network: sepolia
    source:
      address: "0x0E8C14B3f77540feFafA87a9c6406894E30fB9Cb"
      abi: ProofVerifier
      startBlock: 8000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proof
        - User
      abis:
        - name: ProofVerifier
          file: ProofVerifier\ProofVerifier.json
      eventHandlers:
        - event: ProofSubmitted(indexed address,bytes32)
          handler: handleProofSubmitted
      file: ProofVerifier\ProofVerifier.wasm
