specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: ProofVerifier
    network: sepolia
    source:
      address: "0xfa4ecd7e60a06567c5d16e7fcb05c46f479d0451"
      abi: ProofVerifier
      startBlock: 8000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proof
        - User
      abis:
        - name: ProofVerifier
          file: ProofVerifier\ProofVerifier.json
      eventHandlers:
        - event: ProofSubmitted(indexed address,bytes32)
          handler: handleProofSubmitted
      file: ProofVerifier\ProofVerifier.wasm
  - kind: ethereum
    name: SoulboundNft
    network: sepolia
    source:
      address: "0xb22f6d60c49f325813185c77b8a5b3b23eb130e6"
      abi: SoulboundNft
      startBlock: 8000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NFT
      abis:
        - name: SoulboundNft
          file: SoulboundNft\SoulboundNft.json
      eventHandlers:
        - event: Issued(indexed address,indexed uint256,indexed bytes32,string)
          handler: handleIssued
        - event: Revoked(indexed address,indexed uint256,bytes32)
          handler: handleRevoked
      file: SoulboundNft\SoulboundNft.wasm
